# AutoModpack configuration. Docs: https://moddedmc.wiki/en/project/automodpack/docs
modpack-host: true
generate-modpack-on-start: true
# host-modpack/<id>/ is included in full. from-server pulls extra files from the server root. exclude and editable apply after that; they do not add files.
modpack: {
  name: "Changos"
  General: {
    main: {
      display-name: "Core"
      description: "Mods required to join the server"
      # REQUIRED is always installed. RECOMMENDED is pre-selected, players can opt out. OPTIONAL starts unchecked.
      selection: REQUIRED
      # DISABLED ships every jar. METADATA and PLATFORMS drop dedicated-server jars on a best-effort basis. Use exclude for anything else.
      auto-exclude-server-side-mods: METADATA
      breaks-with: []
      requires: []
      compatible-platforms: []
      # extra paths from the server root
      from-server: [mods/*.jar, kubejs/**, emotes/*]
      # drop these from the pack; they do not add files
      exclude: [**/.*, **/.*/**, "**/*.{tmp,disabled,bak}", kubejs/server_scripts/**, mods/shopguard-0.9.0+mc26.3.jar, mods/Discord-MC-Chat-2.7.1.jar, config/discord-mc-chat.json, config/discord-mc-chat-backup.json, config/discord-mc-chat/**, mods/journeymap-fabric-26.3-6.0.10.jar, mods/jei-26.3-fabric-31.12.0.65.jar, mods/mezz_config-26.3-fabric-0.6.8.jar, mods/trashslot-fabric-26.3-26.3.0.1.jar, mods/dreamdisplays-fabric-26.3-1.10.6.jar, mods/treeharvester-26.3.0-10.3.jar, mods/collective-26.3.0-8.58.jar]
      # pack files players may change; listing a path here does not add it to the pack
      editable: [options.txt, config/**]
    }
    extras: {
      display-name: "Extras"
      description: "JourneyMap, JEI, TrashSlot, Dream Displays and Tree Harvester"
      # REQUIRED is always installed. RECOMMENDED is pre-selected, players can opt out. OPTIONAL starts unchecked.
      selection: RECOMMENDED
      # DISABLED ships every jar. METADATA and PLATFORMS drop dedicated-server jars on a best-effort basis. Use exclude for anything else.
      auto-exclude-server-side-mods: METADATA
      breaks-with: []
      requires: [main]
      compatible-platforms: []
      # extra paths from the server root
      from-server: [mods/journeymap-fabric-26.3-6.0.10.jar, mods/jei-26.3-fabric-31.12.0.65.jar, mods/mezz_config-26.3-fabric-0.6.8.jar, mods/trashslot-fabric-26.3-26.3.0.1.jar, mods/dreamdisplays-fabric-26.3-1.10.6.jar, mods/treeharvester-26.3.0-10.3.jar, mods/collective-26.3.0-8.58.jar]
      # drop these from the pack; they do not add files
      exclude: [**/.*, **/.*/**, "**/*.{tmp,disabled,bak}"]
      # pack files players may change; listing a path here does not add it to the pack
      editable: []
    }
  }
}
require-modpack: true
nag-un-modded-clients: true
nag-message: "Install the AutoModpack mod to get this server's modpack!"
nag-clickable-message: "Click here to get the AutoModpack!"
nag-clickable-link: https://modrinth.com/project/automodpack
bind-address: ""
bind-port: -1
advertised-endpoint-host: ""
advertised-endpoint-port: -1
disable-internal-tls: false
accept-proxy-protocol: false
# HOLEPUNCH uses the Minecraft port. MAGIC can share it or use bindPort. HTTP uses bindPort.
connection-mode: HOLEPUNCH
bandwidth-limit: 0
# require a login-issued download secret
validate-secrets: true
secret-lifetime: 336
export-http-directory: ""
export-http-include-all: false
self-updater: false
# extra loaders allowed to join; this server's loader is always accepted
accepted-loaders: [fabric]
# tell clients the pack Minecraft and loader versions
advertise-versions-to-sync: true
